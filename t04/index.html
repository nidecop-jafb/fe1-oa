</style><script>
(function () {
  var RE = /^[\s(±+\-−–]*\d[\d\s.,]*(\s*[±]\s*[\d.,]+)?\s*[)]?\s*([a-zA-Zµμ°%²³·\/]{1,8}\)?)?\s*$/;
  var NAO = 'header, footer, nav, aside, figcaption, small, svg, table, .fe1-topo, .fe1-menu, .fe1-estilo, [class*="aba"], [class*="rodape"], [class*="footer"], [class*="legenda"], [class*="card"], [class*="cartao"], [class*="header"], [class*="piazzi"], [class*="selo"], .badge, button, label, summary';
  function marcar() {
    var cs = document.querySelectorAll('td, th'), i, e, n, t;
    for (i = 0; i < cs.length; i++) {
      t = cs[i].textContent;
      if (t && t.length < 40 && RE.test(t)) cs[i].classList.add('fe1-num');
    }
    if (!true) return;
    var raiz = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    var todos = document.body.querySelectorAll('div, span, p, li, dd, blockquote');
    for (i = 0; i < todos.length; i++) {
      e = todos[i];
      if (e.closest(NAO)) continue;
      t = 0;
      for (n = e.firstChild; n; n = n.nextSibling) if (n.nodeType === 3) t += n.textContent.trim().length;
      if (t < 60) continue;
      if (parseFloat(getComputedStyle(e).fontSize) / raiz < 1.06) e.classList.add('fe1-corrido');
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', marcar);
  else marcar();
})();
</script><!-- VISUAL:FIM -->
